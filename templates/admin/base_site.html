{% extends "admin/base.html" %}
{% load i18n %}

{% block title %}{{ title }} | Fountain of Grace Admin{% endblock %}

{% block branding %}
<div id="site-name">
  <a href="{% url 'admin:index' %}" style="display:flex;align-items:center;gap:10px;text-decoration:none;">
    <div style="width:36px;height:36px;border-radius:50%;background:#c0182a;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 0 12px rgba(192,24,42,.5);">
      <span style="color:#fff;font-size:1rem;">✝</span>
    </div>
    <div>
      <div style="font-size:.95rem;font-weight:800;color:#fff;letter-spacing:-.01em;line-height:1;">Fountain of Grace</div>
      <div style="font-size:.58rem;color:rgba(255,255,255,.5);letter-spacing:.14em;text-transform:uppercase;font-weight:500;">Church Admin Panel</div>
    </div>
  </a>
</div>
{% endblock %}

{% block nav-global %}{% endblock %}

{% block extrahead %}
{{ block.super }}
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --red:#c0182a;--red2:#e8253a;--gold:#d4a843;
  --bg:#0a0e1a;--bg2:#0f1525;--bg3:#141c2e;--bg4:#1a2438;
  --text:#e8edf8;--muted:#7a8aaa;--border:rgba(255,255,255,.08);
}
*{font-family:'Poppins',sans-serif!important;}
/* Header */
#header{
  background:linear-gradient(135deg,var(--bg) 0%,var(--bg2) 100%)!important;
  border-bottom:1px solid var(--border)!important;
  padding:12px 24px!important;
  box-shadow:0 4px 24px rgba(0,0,0,.4)!important;
}
#branding h1{margin:0!important;}
#branding h1 a{color:#fff!important;}
/* User tools */
#user-tools{font-size:.72rem!important;color:var(--muted)!important;}
#user-tools a{color:var(--muted)!important;transition:color .2s!important;}
#user-tools a:hover{color:#fff!important;}
/* Nav breadcrumbs */
div.breadcrumbs{
  background:var(--bg2)!important;
  border-bottom:1px solid var(--border)!important;
  padding:10px 24px!important;
  font-size:.72rem!important;
  color:var(--muted)!important;
}
div.breadcrumbs a{color:var(--red2)!important;}
/* Sidebar */
#nav-sidebar{
  background:var(--bg2)!important;
  border-right:1px solid var(--border)!important;
  min-width:220px!important;
}
.sticky{background:var(--bg2)!important;}
/* Main content */
#content-main,#content{
  background:var(--bg)!important;
  color:var(--text)!important;
}
#content h1{
  font-size:1.4rem!important;font-weight:800!important;
  color:var(--text)!important;margin-bottom:20px!important;
}
/* Module headers */
.module h2,.module caption{
  background:linear-gradient(135deg,var(--red),var(--red2))!important;
  color:#fff!important;font-size:.72rem!important;
  font-weight:700!important;letter-spacing:.12em!important;
  text-transform:uppercase!important;padding:10px 14px!important;
  border-radius:8px 8px 0 0!important;
}
/* Module body */
.module{
  background:var(--bg3)!important;
  border:1px solid var(--border)!important;
  border-radius:10px!important;overflow:hidden!important;
  box-shadow:0 2px 12px rgba(0,0,0,.3)!important;
  margin-bottom:18px!important;
}
/* App index links */
.app-churchcore th,.app-core th,.app-auth th{
  background:rgba(192,24,42,.08)!important;
  border-bottom:1px solid var(--border)!important;
}
th[scope=row] a,td a{color:var(--red2)!important;font-weight:500!important;}
th[scope=row] a:hover,td a:hover{color:#fff!important;}
/* Changelist table */
#changelist-filter{
  background:var(--bg3)!important;
  border-left:1px solid var(--border)!important;
}
#changelist-filter h2{
  background:var(--bg4)!important;color:var(--muted)!important;
  font-size:.62rem!important;letter-spacing:.2em!important;
  text-transform:uppercase!important;padding:10px 14px!important;
  border-bottom:1px solid var(--border)!important;
}
#changelist-filter h3{color:var(--text)!important;font-size:.75rem!important;font-weight:700!important;}
#changelist-filter li.selected a{color:var(--red2)!important;font-weight:700!important;}
#changelist-filter a{color:var(--muted)!important;}
#changelist-filter a:hover{color:var(--red2)!important;}
/* Results table */
#result_list{width:100%!important;}
#result_list thead th{
  background:var(--bg4)!important;
  color:var(--muted)!important;font-size:.65rem!important;
  letter-spacing:.12em!important;text-transform:uppercase!important;
  border-bottom:1px solid var(--border)!important;
  padding:10px 12px!important;font-weight:700!important;
}
#result_list thead th a{color:var(--muted)!important;}
#result_list thead th.sorted a{color:var(--red2)!important;}
#result_list tbody tr{
  background:var(--bg3)!important;
  border-bottom:1px solid var(--border)!important;
  transition:background .2s!important;
}
#result_list tbody tr:hover{background:var(--bg4)!important;}
#result_list tbody td{
  color:var(--text)!important;padding:10px 12px!important;
  font-size:.82rem!important;border-bottom:none!important;
}
/* Forms */
.form-row{
  background:var(--bg3)!important;
  border-bottom:1px solid var(--border)!important;
  padding:14px 16px!important;
}
.form-row label{
  color:var(--muted)!important;font-size:.65rem!important;
  font-weight:700!important;letter-spacing:.14em!important;
  text-transform:uppercase!important;
}
input[type=text],input[type=email],input[type=url],input[type=password],
input[type=number],textarea,select{
  background:rgba(255,255,255,.05)!important;
  border:1.5px solid rgba(255,255,255,.1)!important;
  border-radius:8px!important;color:var(--text)!important;
  padding:9px 12px!important;font-size:.84rem!important;
  font-family:'Poppins',sans-serif!important;
  transition:border-color .2s!important;width:100%!important;
}
input:focus,textarea:focus,select:focus{
  border-color:var(--red)!important;
  outline:none!important;
  background:rgba(192,24,42,.04)!important;
}
select option{background:var(--bg3)!important;color:var(--text)!important;}
/* Checkboxes */
input[type=checkbox]{accent-color:var(--red)!important;width:16px!important;height:16px!important;}
/* Buttons */
.button,input[type=submit],.submit-row input{
  background:var(--red)!important;color:#fff!important;
  border:none!important;border-radius:8px!important;
  padding:10px 20px!important;font-size:.75rem!important;
  font-weight:700!important;letter-spacing:.06em!important;
  cursor:pointer!important;transition:all .2s!important;
  font-family:'Poppins',sans-serif!important;
}
.button:hover,input[type=submit]:hover,.submit-row input:hover{
  background:var(--red2)!important;transform:translateY(-1px)!important;
  box-shadow:0 4px 14px rgba(192,24,42,.4)!important;
}
.button.default,input[type=submit].default{
  background:var(--red)!important;
}
a.deletelink{
  background:rgba(192,24,42,.15)!important;color:var(--red2)!important;
  border:1px solid rgba(192,24,42,.3)!important;border-radius:8px!important;
  padding:9px 18px!important;font-size:.72rem!important;font-weight:700!important;
  transition:all .2s!important;
}
a.deletelink:hover{background:var(--red)!important;color:#fff!important;}
/* Submit row */
.submit-row{
  background:var(--bg2)!important;
  border-top:1px solid var(--border)!important;
  border-radius:0 0 10px 10px!important;
  padding:14px 16px!important;
  display:flex!important;gap:10px!important;align-items:center!important;
  flex-wrap:wrap!important;
}
/* Help text */
.help{color:var(--muted)!important;font-size:.7rem!important;line-height:1.5!important;}
/* Errors */
.errornote,.errorlist li{
  background:rgba(192,24,42,.12)!important;
  border:1px solid rgba(192,24,42,.3)!important;
  border-radius:8px!important;color:#ff8fa3!important;
  padding:10px 14px!important;font-size:.8rem!important;
}
/* Success messages */
.messagelist li.success{
  background:rgba(34,197,94,.12)!important;
  border:1px solid rgba(34,197,94,.3)!important;
  border-radius:8px!important;color:#86efac!important;
  padding:10px 14px!important;font-size:.8rem!important;
  list-style:none!important;
}
.messagelist li{
  border-radius:8px!important;padding:10px 14px!important;
  font-size:.8rem!important;list-style:none!important;
  margin-bottom:8px!important;
}
/* Fieldsets */
fieldset{
  background:var(--bg3)!important;
  border:1px solid var(--border)!important;
  border-radius:10px!important;margin-bottom:16px!important;
  overflow:hidden!important;
}
fieldset h2{
  background:var(--bg4)!important;color:var(--text)!important;
  font-size:.72rem!important;font-weight:700!important;
  letter-spacing:.12em!important;text-transform:uppercase!important;
  padding:10px 16px!important;border-bottom:1px solid var(--border)!important;
  margin:0!important;
}
fieldset.collapse h2{cursor:pointer!important;}
/* Dashboard index */
#content-related{background:var(--bg3)!important;}
.dashboard #content{padding:24px!important;}
/* Actions */
.actions{
  background:var(--bg3)!important;
  border:1px solid var(--border)!important;
  border-radius:8px!important;padding:10px 14px!important;
  margin-bottom:14px!important;
}
select[name=action]{
  width:auto!important;margin-right:8px!important;
}
/* Pagination */
.paginator{color:var(--muted)!important;font-size:.75rem!important;}
.paginator a{color:var(--red2)!important;}
.paginator .this-page{
  background:var(--red)!important;color:#fff!important;
  border-radius:6px!important;padding:3px 8px!important;
}
/* Inline */
.inline-group{
  background:var(--bg3)!important;
  border:1px solid var(--border)!important;
  border-radius:10px!important;margin-bottom:16px!important;
}
.inline-group h2{
  background:var(--bg4)!important;color:var(--text)!important;
  font-size:.72rem!important;font-weight:700!important;
  letter-spacing:.12em!important;text-transform:uppercase!important;
  padding:10px 16px!important;border-bottom:1px solid var(--border)!important;
  border-radius:10px 10px 0 0!important;margin:0!important;
}
/* Dashboard recent actions */
#recent-actions-module .actionlist li{
  color:var(--muted)!important;font-size:.78rem!important;
  padding:8px 0!important;border-bottom:1px solid var(--border)!important;
}
#recent-actions-module .actionlist a{color:var(--red2)!important;}
/* Make body dark */
body{background:var(--bg)!important;color:var(--text)!important;}
/* scrollbar */
::-webkit-scrollbar{width:4px!important;height:4px!important;}
::-webkit-scrollbar-track{background:var(--bg)!important;}
::-webkit-scrollbar-thumb{background:var(--red)!important;border-radius:2px!important;}
/* Responsive */
@media(max-width:767px){
  #header{padding:10px 14px!important;}
  .dashboard #content{padding:14px!important;}
}
</style>
{% endblock %}
