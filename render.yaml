services:
  - type: web
    name: glam_church_site
    env: python
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py setup_site && python manage.py check_cloudinary"
    startCommand: "gunicorn church_site.wsgi"
    envVars:
      - key: SECRET_KEY
        value: glam-church-secret-key-2026-xyz-abc
      - key: DEBUG
        value: "False"
      # Paste the real values in the Render dashboard (Environment tab).
      # Never commit your API secret to GitHub.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
